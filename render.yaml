# Render blueprint for a free public demo of HisabSetu AI.
#
# 1. Push this repository to GitHub (the .env file is NOT pushed — it is ignored).
# 2. Render → New → Blueprint → pick the repo. Render reads this file.
# 3. Set GNANI_API_KEY when prompted (it is `sync: false`, so the value is asked
#    for in the dashboard and never stored in the repository).
#
# Caveats, on purpose: the free plan sleeps after inactivity (slow first load)
# and has an ephemeral filesystem, so SQLite lives in /tmp and resets whenever
# the service restarts or redeploys — sample data is re-seeded on boot. That is
# fine for a demo; see docs/deploy.md for the persistent-disk option.
services:
  - type: web
    name: hisabsetu-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GNANI_API_KEY
        sync: false
      - key: GNANI_STT_LANGUAGE
        value: hi-IN
      - key: GNANI_TTS_VOICE
        value: Nalini
      - key: VOICE_KHATA_DB_URL
        value: sqlite:////tmp/khata.db
      - key: VOICE_KHATA_SEED
        value: "1"
      - key: MAX_RECORD_SECONDS
        value: "30"
